name: One-shot Intui response shape diagnostic

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  intui-diagnostic:
    if: >-
      false && # Completed one-shot diagnostic on 2026-11-05; do not re-run
      github.event.label.name == 'documentation' &&
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.ref == 'feature/intui-api-safe-2026-11-05' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: One read-only Intui JSON shape request
        env:
          INTUI_API_KEY: ${{ secrets.INTUI_API_KEY }}
          INTUI_DIAGNOSTIC_ALLOWED: "shape-20261105"
        run: node scripts/intui-response-shape-check.mjs
