name: One-shot Intui response shape diagnostic

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  intui-diagnostic:
    # Completed on 2026-11-05. Keep disabled to prevent another provider call.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: One read-only Intui JSON shape request
        env:
          INTUI_API_KEY: ${{ secrets.INTUI_API_KEY }}
          INTUI_DIAGNOSTIC_ALLOWED: "shape-20261105"
        run: node scripts/intui-response-shape-check.mjs
