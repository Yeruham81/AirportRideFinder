name: Temporary Alps Ski-Bag Quote Check
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify winter ski bags in two official public quotes (no credentials)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          cases = [
            ("winter-Geneva-Chamonix", "airport-1", "resort-11", "2027-01-22"),
            ("winter-Geneva-Avoriaz", "airport-1", "resort-3", "2027-02-11"),
          ]
          for tag, fr, to, date in cases:
            query = urllib.parse.urlencode(dict(
              **{"from":fr}, to=to, date=date,time="14:00",adults="3",
              luggage="3",ski_bags="3",ski="1",is_flight="0",currency="EUR",
            ))
            url="https://booking.alps2alps.com/api/public/v1/transfer-options?"+query
            try:
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"AirportRideFinder-ReadOnly-API-Diagnostic/1.0"})
              with urllib.request.urlopen(req,timeout=16) as response:
                body=json.loads(response.read(200000))
                outbound=body.get("outbound") or {}
                bag=outbound.get("luggage") or {}
                print(tag,"HTTP",response.status,"adults",(body.get("passengers") or {}).get("adults"),
                  "bags_returned", bag.get("ski_bags"),"suitcases_returned",bag.get("normal_suitcases"),
                  "vehicle_count",len(outbound.get("vehicles") or []))
            except Exception as err:
              print(tag,"FAILED",str(err)[:120])
          PY
