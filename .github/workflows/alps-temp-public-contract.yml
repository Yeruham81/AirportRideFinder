name: Temporary Alps Public Contract Probe
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check public catalog and safe quote echo fields (no keys, no bookings)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          targets = [
            ("catalog", "https://booking.alps2alps.com/api/resource/destinations"),
            ("search_Ge", "https://booking.alps2alps.com/api/public/v1/locations/search?q=Ge"),
            ("quote_winter", "https://booking.alps2alps.com/api/public/v1/transfer-options?from=airport-1&to=resort-11&date=2026-11-13&time=14%3A00&adults=2&luggage=2&ski_bags=0&ski=0&is_flight=0&currency=EUR"),
            ("quote_summer_skis", "https://booking.alps2alps.com/api/public/v1/transfer-options?from=airport-1&to=resort-11&date=2027-07-22&time=14%3A00&adults=2&luggage=2&ski_bags=2&ski=1&is_flight=0&currency=GBP"),
          ]
          for title,url in targets:
            try:
              req = urllib.request.Request(url, headers={"Accept":"application/json","User-Agent":"AirportRideFinder-development-contract-check/1.0"})
              with urllib.request.urlopen(req, timeout=12) as response:
                raw = response.read(900000)
                print(title, "http", response.status, "content_type", response.headers.get("content-type"), "bytes",len(raw), "cors", response.headers.get("access-control-allow-origin"))
              j = json.loads(raw)
              if title == "catalog":
                print("catalog_top_level", type(j).__name__, "count",len(j) if isinstance(j,list) else len(j.keys()) if isinstance(j,dict) else None)
                if isinstance(j,dict): print("catalog_keys", list(j)[:12])
                if isinstance(j,list) and j: print("catalog_first_keys",sorted(j[0]) if isinstance(j[0],dict) else type(j[0]).__name__)
              elif title == "search_Ge":
                print("search_number",len(j) if isinstance(j,list) else "unknown")
                if isinstance(j,list):print("search_samples",[ {k:v.get(k) for k in ("code","name","type","country")} for v in j[:6] if isinstance(v,dict)])
              elif isinstance(j,dict):
                print(title,"currency",j.get("currency"),"route",{k:(j.get("route") or {}).get(k) for k in ("from_code","to_code","from","to")},"passengers",(j.get("passengers") or {}).get("adults"))
                print(title,"pickup",(j.get("outbound") or {}).get("pick_up_date_time"),"luggage",(j.get("outbound") or {}).get("luggage"),"vehicle_count",len((j.get("outbound") or {}).get("vehicles") or []))
            except Exception as error:
              print(title, "error",str(error)[:140])
          PY
