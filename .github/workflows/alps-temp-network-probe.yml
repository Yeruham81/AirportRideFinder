name: Temporary Alps Sandbox Network Diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check sandbox DNS and HTTPS without credentials
        shell: bash
        run: |
          set +e
          echo "Checking public DNS resolution for official sandbox hostname (no secrets used)"
          python3 - <<'PY'
          import socket
          hostname = "sandbox.amitours.com"
          try:
              addresses = sorted({v[4][0] for v in socket.getaddrinfo(hostname, 443, type=socket.SOCK_STREAM)})
              print("DNS: resolved, address count:", len(addresses))
          except Exception as error:
              print("DNS failed:", error.__class__.__name__, str(error))
          PY
          echo "Checking HTTPS transport without authentication, redirect following disabled"
          curl -sS -I --max-time 12 --connect-timeout 6 \
            --output /dev/null --write-out "HTTP status: %{http_code}; remote IP: %{remote_ip}; TLS verify: %{ssl_verify_result}\n" \
            https://sandbox.amitours.com/api/v2/token
          echo "Curl exit code: $?"
          exit 0
