name: One-shot Intui metadata aggregate
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  metadata:
    if: >-
      github.event.label.name == 'documentation' &&
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.ref == 'feature/intui-api-safe-2026-11-05' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout same-repo PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Make ONE read-only Intui request and aggregate metadata
        env:
          INTUI_API_KEY: ${{ secrets.INTUI_API_KEY }}
          INTUI_LIVE_ENABLED: "true"
          INTUI_DIAGNOSTIC_ALLOWED: "metadata-smoke-20261105"
        run: bun scripts/intui-metadata-smoke.ts
