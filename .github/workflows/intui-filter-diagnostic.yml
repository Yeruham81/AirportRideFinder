name: One-shot Intui rejection analysis
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  verify-fields:
    if: >-
      github.event.label.name == 'bug' &&
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.ref == 'feature/intui-api-safe-2026-11-05' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Inspect aggregate field acceptances (one Intui request)
        env:
          INTUI_API_KEY: ${{ secrets.INTUI_API_KEY }}
          INTUI_DIAGNOSTIC_ALLOWED: "filter-20261105"
        run: node scripts/intui-filter-diagnostic.mjs
