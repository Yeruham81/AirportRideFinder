name: Temporary Read-Only Alps Seasonal Baggage Probe
on:
  pull_request:
    branches: [main]
jobs:
  seasonal-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Compare provider-confirmed winter/summer baggage by date (no keys, no bookings)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request
          cases=[
             "2026-11-13","2026-12-01","2026-12-15","2027-03-31",
             "2027-04-01","2027-04-15","2027-04-30","2027-05-01",
             "2027-05-15","2027-10-31","2027-11-01","2027-12-01"
          ]
          for date in cases:
            q=urllib.parse.urlencode({"from":"airport-1","to":"resort-11",
              "date":date,"time":"14:00","adults":"3","luggage":"3",
              "ski_bags":"3","ski":"1","is_flight":"0","currency":"EUR"})
            url="https://booking.alps2alps.com/api/public/v1/transfer-options?"+q
            try:
              request=urllib.request.Request(url,headers={
                "Accept":"application/json","User-Agent":"AirportRideFinder-Technical-Quote-Check/1.0"})
              with urllib.request.urlopen(request,timeout=15) as response:
                data=json.loads(response.read(300000))
                l=(data.get("outbound") or {}).get("luggage") or {}
                print(date,"http",response.status,"suitcases",l.get("normal_suitcases"),
                  "skis",l.get("ski_bags"),"vehicle_count",len((data.get("outbound") or {}).get("vehicles") or []))
            except Exception as e:
              print(date, "problem",type(e).__name__,str(e)[:130])
              if "429" in str(e):
                print("Rate limit encountered; stopping further probes")
                break
            time.sleep(1.1)
          PY
