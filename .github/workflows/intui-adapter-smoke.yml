name: One-shot Intui read-only adapter smoke test
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  adapter-smoke:
    if: >-
      github.event.label.name == 'enhancement' &&
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.ref == 'feature/intui-api-safe-2026-11-05' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read approved branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install exact dependencies
        run: bun install --frozen-lockfile
      - name: Make exactly one Intui availability request
        env:
          INTUI_API_KEY: ${{ secrets.INTUI_API_KEY }}
          INTUI_LIVE_ENABLED: "true"
          INTUI_DIAGNOSTIC_ALLOWED: "adapter-smoke-20261105"
        run: bun scripts/intui-adapter-smoke.ts
